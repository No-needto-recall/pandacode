name: Chinese preview builds

on:
  push:
    branches: [feat/zh-cn-localization]
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Optional matching Connect HTTPS origin (otherwise repository variable)'
        type: string
        default: ''
      github_client_id:
        description: 'Optional public GitHub OAuth client ID, never a client secret'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: zh-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RELEASE_TARGET: windows-x86_64
      PANDACODE_PREVIEW_BUILD: '1'
      VITE_PANDACODE_PREVIEW: '1'
      STATIC_VCRUNTIME: 'true'
      CARGO_BUILD_JOBS: '2'
      PANDACODE_RELAY_URL: ${{ inputs.relay_url || vars.PANDACODE_RELAY_URL }}
      PANDACODE_GITHUB_CLIENT_ID: ${{ inputs.github_client_id || vars.PANDACODE_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: windows-zh-preview
      - run: npm ci
      - name: Validate optional Connect configuration
        id: connect
        run: node scripts/release/preview-config.mjs
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - name: Build isolated Chinese preview installer
        shell: pwsh
        run: |
          $config = Join-Path $PWD 'src-tauri/tauri.zh-preview.conf.json'
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged startup on the disposable runner
        timeout-minutes: 4
        run: node scripts/release/ci-startup-smoke.mjs
      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe')
          if ($packages.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $name = 'PandaCode-zh-CN-Windows-x64-setup.exe'
          Copy-Item $packages[0].FullName (Join-Path artifacts $name)
          $hash = (Get-FileHash (Join-Path artifacts $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path artifacts "$name.sha256") -Encoding ascii
          Copy-Item docs/localization-downloads.md artifacts/README.md
          @{ sourceCommit = $env:GITHUB_SHA; target = 'windows-x86_64'; signing = 'unsigned preview'; connectConfigured = '${{ steps.connect.outputs.configured }}' -eq 'true'; autoUpdater = 'disabled' } | ConvertTo-Json | Set-Content artifacts/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: artifact
        with:
          name: PandaCode-zh-CN-Windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Download link
        shell: pwsh
        run: '"Windows installer: ${{ steps.artifact.outputs.artifact-url }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append'

  android:
    name: Android ARM64 standalone preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PANDACODE_ANDROID_PREVIEW: '1'
      PANDACODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_PANDACODE_DEMO: '0'
      PANDACODE_RELAY_URL: ${{ inputs.relay_url || vars.PANDACODE_RELAY_URL }}
      PANDACODE_GITHUB_CLIENT_ID: ${{ inputs.github_client_id || vars.PANDACODE_GITHUB_CLIENT_ID }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install SDK 58 Android toolchain
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci --prefix mobile
      - name: Validate optional Connect configuration
        run: node scripts/release/preview-config.mjs
      - run: node scripts/i18n/generate.mjs --check
      - run: npm --prefix mobile run typecheck
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run lint
      - name: Generate Android native project in CI only
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release-mode APK with embedded JavaScript
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --console=plain
      - name: Verify APK signature, package, release mode and ARM64 bundle
        run: |
          mkdir -p artifacts
          apk=artifacts/PandaCode-zh-CN-Android-arm64-preview.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee artifacts/SIGNING.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$apk"
          analyzer="$(command -v apkanalyzer)"
          test "$("$analyzer" manifest application-id "$apk")" = 'io.github.norecall.pandacode.zhpreview'
          test "$("$analyzer" manifest debuggable "$apk")" = 'false'
          node mobile/scripts/verify-apk.mjs "$apk"
          cp docs/localization-downloads.md artifacts/README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: artifact
        with:
          name: PandaCode-zh-CN-Android-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Download link
        run: 'printf "Android APK: %s\n" "${{ steps.artifact.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"'
